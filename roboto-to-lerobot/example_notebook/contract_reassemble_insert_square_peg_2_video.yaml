# REASSEMBLE — "Insert square peg 2" LeRobot export contract, with camera video.
#
# Declares the arm's state/action features plus the two camera streams.
# Target collection: cl_wwhnk98wa08g ("Insert square peg 2 — confident
# successes", 18 action events).
#
# The cameras are foxglove_msgs/msg/CompressedVideo (H.264, Annex B, one access
# unit per message, ~31 fps, 640x480, 2 s GOP with in-band SPS/PPS at every
# keyframe). The converter GOP-decodes each episode's range, so the contract
# only has to declare the topic's real schema name.

name: reassemble_insert_square_peg_2_video
version: 1

robot_type: pick_and_place

fps: 10  # [Hz] reference timeline for the output dataset

observations:
  # Arm joint positions. /robot/joint_states publishes at ~940 Hz, so a
  # hold-align onto the 10 Hz timeline is always satisfied well inside
  # tolerance.
  - key: observation.state
    topic: /robot/joint_states
    type: sensor_msgs/msg/JointState
    selector:
      names:
        - joint_1
        - joint_2
        - joint_3
        - joint_4
        - joint_5
        - joint_6
        - joint_7
      lerobot_names:
        - arm_1
        - arm_2
        - arm_3
        - arm_4
        - arm_5
        - arm_6
        - arm_7
    align: {method: hold, tolerance_ms: 1500}

  # Scene camera. Native resolution is 640x480; resize keeps it there rather
  # than upscaling.
  - key: observation.images.external
    topic: /camera/hama1/video
    type: foxglove_msgs/msg/CompressedVideo
    image:
      resize: [480, 640]   # [height, width]
    align: {method: nearest, tolerance_ms: 150}

  # Wrist camera, same encoding and resolution as the scene camera.
  - key: observation.images.gripper
    topic: /camera/hand/video
    type: foxglove_msgs/msg/CompressedVideo
    image:
      resize: [480, 640]   # [height, width]
    align: {method: nearest, tolerance_ms: 150}

actions:
  # Gripper finger positions, also ~940 Hz.
  - key: action
    topic: /robot/gripper_states
    type: sensor_msgs/msg/JointState
    selector:
      names:
        - finger_joint1
        - finger_joint2
      lerobot_names:
        - gripper_1
        - gripper_2
    transforms:  # executed in order of appearance
      - type: resample_uniform
        stage: pre
      - type: butterworth_lowpass
        stage: pre
        cutoff_hz: 30
        order: 2

# The episode `task` string is not read from a `tasks:` stream here: every
# event in cl_wwhnk98wa08g already carries metadata.task = "Insert square
# peg 2", and event metadata always wins over a tasks: stream.
